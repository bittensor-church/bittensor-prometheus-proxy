name: Run linter and tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  PYTHON_DEFAULT_VERSION: "3.11"
  # pip < 26.2.2 vendors a certifi that trusts the compromised eMudhra CAs; the hash pin protects this download.
  PIP_REQUIREMENT: "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up Python ${{ env.PYTHON_DEFAULT_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
          cache: "pip"
      - name: Upgrade pip
        run: python -m pip install "$PIP_REQUIREMENT"
      - name: Install dependencies
        run: python -m pip install nox==2026.8.17 pdm==2.29.2
      - name: Run linters
        run: nox -vs lint
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up Python ${{ env.PYTHON_DEFAULT_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
          cache: "pip"
      - name: Upgrade pip
        run: python -m pip install "$PIP_REQUIREMENT"
      - name: Install dependencies
        run: python -m pip install nox==2026.8.17 pdm==2.29.2
      - name: Prepare environment
        run: ./setup-dev.sh
      - name: Run dockerized services
        run: docker compose up -d --wait db redis
      - name: Run migrations
        run: cd app/src && pdm run python manage.py wait_for_database --timeout 120 && pdm run python manage.py migrate
        env:
          HOME: /tmp
      - name: Run unit tests
        run: nox -vs test
      - name: Stop dockerized services
        if: success() || failure()
        run: docker compose down -v

  test_integration:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up Python ${{ env.PYTHON_DEFAULT_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
          cache: "pip"
      - name: Upgrade pip
        run: python -m pip install "$PIP_REQUIREMENT"
      - name: Install dependencies
        run: python -m pip install nox==2026.8.17 pdm==2.29.2
      - name: Prepare environment
        run: ./setup-dev.sh
      - name: Start services
        run: docker compose up -d --wait db redis tempo central-prometheus
      - name: Run migrations
        run: cd app/src && pdm run python manage.py wait_for_database --timeout 120 && pdm run python manage.py migrate
        env:
          HOME: /tmp
      - name: Run integration tests
        run: nox -vs test_integration
      - name: Stop services
        if: success() || failure()
        run: docker compose down -v
